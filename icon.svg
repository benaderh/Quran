<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f6b4a"/>
      <stop offset="1" stop-color="#063d2a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e08a"/>
      <stop offset="1" stop-color="#c9992b"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="82" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <!-- Rub el Hizb : deux carrés superposés -->
  <g transform="translate(256 170)" fill="none" stroke="url(#gold)" stroke-width="6">
    <rect x="-62" y="-62" width="124" height="124"/>
    <rect x="-62" y="-62" width="124" height="124" transform="rotate(45)"/>
    <circle r="22" fill="url(#gold)" stroke="none"/>
  </g>

  <!-- Livre ouvert -->
  <g transform="translate(256 330)">
    <path d="M0 -40 C-40 -62 -100 -62 -140 -44 L-140 34 C-100 16 -40 16 0 40 Z" fill="#fdf6dc" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <path d="M0 -40 C40 -62 100 -62 140 -44 L140 34 C100 16 40 16 0 40 Z" fill="#fdf6dc" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="#c9992b" stroke-width="3" opacity=".6" fill="none">
      <path d="M-120 -24 C-90 -34 -50 -34 -16 -20"/>
      <path d="M-120 -4 C-90 -14 -50 -14 -16 0"/>
      <path d="M-120 16 C-90 6 -50 6 -16 20"/>
      <path d="M120 -24 C90 -34 50 -34 16 -20"/>
      <path d="M120 -4 C90 -14 50 -14 16 0"/>
      <path d="M120 16 C90 6 50 6 16 20"/>
    </g>
  </g>

  <!-- Texte -->
  <text x="256" y="452" text-anchor="middle" direction="rtl" font-size="72" font-weight="700"
        font-family="'Amiri','Scheherazade New','Traditional Arabic','Noto Naskh Arabic','Arial',serif"
        fill="url(#gold)">قرآن كريم</text>
</svg>
