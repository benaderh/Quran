plugins {
    id 'com.android.application'
}

android {
    namespace 'quran.hb.com.quran'
    compileSdk 35

    defaultConfig {
        applicationId "quran.hb.com.quran"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Handle large assets (SQLite database)
    aaptOptions {
        noCompress "sqlite", "db"
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES']
        }
    }
}

dependencies {
    // AndroidX - replaces old android.support.*
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Apache POI for reading XLS files (replaces jxl)
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'commons-codec:commons-codec:1.17.0'
    implementation 'com.github.virtuald:curvesapi:1.08'
    implementation 'org.apache.logging.log4j:log4j-api:2.23.1'
}
