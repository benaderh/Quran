plugins {
    id 'com.android.application'
}

android {
    namespace 'quran.hb.com.quran'
    compileSdk 34

    defaultConfig {
        applicationId "quran.hb.com.quran"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.core:core:1.12.0'
    // NOTE: Apache POI removed temporarily for build test
    // Will be added back once basic build works
}
