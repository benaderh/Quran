plugins {
    id 'com.android.application'
}

android {
    compileSdk 35

    namespace "quran.hb.com.quran"

    defaultConfig {
        applicationId "quran.hb.com.quran"
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Permet de lire les fichiers UTF-8 (texte arabe)
    androidResources {
        noCompress 'wav', '3gp', 'mp3'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation files('libs/jxl.jar')
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Résoudre le conflit kotlin-stdlib-jdk7/jdk8 inclus dans kotlin-stdlib >= 1.8
    configurations.configureEach {
        resolutionStrategy {
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
            exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
        }
    }
}
