name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace > build_output.txt 2>&1 || true

    - name: Show last 300 lines of build log
      run: tail -300 build_output.txt

    - name: Upload build log as artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build_output.txt
        retention-days: 3

    - name: Fail if APK not created
      run: test -f app/build/outputs/apk/debug/app-debug.apk && echo "APK OK" || (echo "APK NOT FOUND - build failed" && exit 1)

    - name: Upload Debug APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: quran-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
