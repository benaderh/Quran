name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace > /tmp/build.log 2>&1
        EXIT_CODE=$?
        echo "=== BUILD EXIT CODE: $EXIT_CODE ==="
        if [ $EXIT_CODE -ne 0 ]; then
          echo "=== COMPILATION ERRORS ==="
          grep -n "error:\|FAILED\|Exception\|Caused by\|> Could not\|cannot find symbol\|package.*does not exist\|cannot access" /tmp/build.log | head -80
          echo "=== END ERRORS ==="
        fi
        exit $EXIT_CODE

    - name: Save build log to repo on failure
      if: failure()
      run: |
        cp /tmp/build.log build_error.log
        cat /tmp/build.log | grep -E "error:|FAILED|Exception|Caused by|cannot find" | head -100 > build_errors_summary.txt
        echo "Done"

    - name: Commit error log to repo
      if: failure()
      run: |
        git config user.email "ci@github.com"
        git config user.name "GitHub Actions"
        git add build_error.log build_errors_summary.txt
        git commit -m "ci: save build error log [skip ci]" || echo "Nothing to commit"
        git push || echo "Push failed"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: quran-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
