name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: |
        set -o pipefail
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build_output.txt
        BUILD_EXIT=${PIPESTATUS[0]}
        echo "=== ERRORS FOUND ===" 
        grep -E "^.*(error:|Error:|FAILED|Exception|Caused by|> Could not|cannot find)" /tmp/build_output.txt | head -60 || true
        exit $BUILD_EXIT

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: /tmp/build_output.txt
        retention-days: 3

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: quran-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
