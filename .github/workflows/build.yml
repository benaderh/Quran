name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      id: build
      run: |
        ./gradlew assembleDebug --no-daemon 2>&1 | tee build_output.txt
        exit ${PIPESTATUS[0]}

    - name: Show build output on failure
      if: failure()
      run: |
        echo "=== LAST 200 LINES OF BUILD OUTPUT ==="
        tail -200 build_output.txt || echo "No output file"

    - name: Check APK was created
      run: ls -la app/build/outputs/apk/debug/

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: quran-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
