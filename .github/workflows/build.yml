name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (show all errors)
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "=== JAVA COMPILER ERRORS ==="
          grep -n "error:" /tmp/build_output.txt || echo "No 'error:' lines found"
          exit $EXIT_CODE

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/**/*.apk
