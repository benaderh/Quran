name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK with version and date
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          cp app/build/outputs/apk/debug/app-debug.apk app-quran-${DATE}.apk
          echo "APK_NAME=app-quran-${DATE}.apk" >> $GITHUB_ENV

      - name: Create GitHub Release and upload APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build #${{ github.run_number }}"
          body: |
            ✅ Build automatique — commit `${{ github.sha }}`
            📱 Téléchargez l'APK ci-dessous et installez-le directement sur votre appareil.
          files: ${{ env.APK_NAME }}
          draft: false
          prerelease: false
