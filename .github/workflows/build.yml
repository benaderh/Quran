name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Show environment
      run: |
        java -version
        echo "ANDROID_HOME=$ANDROID_HOME"
        ls $ANDROID_HOME/platforms/ 2>/dev/null || echo "No platforms found"
        ls $ANDROID_HOME/build-tools/ 2>/dev/null || echo "No build-tools found"

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon --info > /tmp/build.log 2>&1
        EXIT=$?
        echo "=== EXIT CODE: $EXIT ==="
        echo "=== LAST 80 LINES ==="
        tail -80 /tmp/build.log
        exit $EXIT

    - name: Commit build log on failure
      if: failure()
      run: |
        cp /tmp/build.log build_error.log
        git config user.email "actions@github.com"
        git config user.name "GitHub Actions"
        git add build_error.log
        git commit -m "ci: build error log [skip ci]"
        git push origin main
        echo "Log committed successfully"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: quran-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
